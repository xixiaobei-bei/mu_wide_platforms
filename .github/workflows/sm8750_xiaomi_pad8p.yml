name: SM8750 Xiaomi Pad8 Pro

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Platforms/PakalaPkg/Device/xiaomi-piano/**'
  workflow_dispatch:

env:
  WM_CI_BUILD: true
  NUGET_PATH: /usr/local/bin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Host toolchain
        run: |
          set -eux
          sudo apt update -qq
          sudo apt install -y -qq --no-install-recommends \
            uuid-dev clang llvm lld gcc-aarch64-linux-gnu git build-essential \
            iasl nasm gettext locales ca-certificates curl \
            python3 python3-venv python3-pip python3-git gnupg mono-devel
          git config --global --add safe.directory '*'
          sudo curl -fsSL --retry 3 -o /usr/local/bin/NuGet.exe \
            https://dist.nuget.org/win-x86-commandline/latest/nuget.exe || true
          python3 -m venv /tmp/muvenv
          . /tmp/muvenv/bin/activate
          pip install --upgrade pip
          pip install -r pip-requirements.txt

      - name: Init submodules (stuart_setup/update)
        run: |
          set -x
          . /tmp/muvenv/bin/activate
          ./build_uefi.py --init || true

      - name: Neutralise unavailable NuGet ext-dep verification
        run: |
          set -x
          . /tmp/muvenv/bin/activate
          python - <<'PY'
          import inspect, pathlib, re
          import edk2toolext.environment.self_describing_environment as sde
          p = pathlib.Path(inspect.getfile(sde))
          s = p.read_text()
          s2, n = re.subn(
              r"(def verify_extdeps\([^)]*\)[^\n]*:\n)",
              r"\1        return True  # CI: NuGet feed unavailable; distro nasm/iasl on PATH\n",
              s, count=1)
          assert n == 1, "verify_extdeps signature not found"
          p.write_text(s2)
          print("patched", p)
          PY
          python -c "from edk2toolext.environment.self_describing_environment import self_describing_environment as S; print('verify ->', S.verify_extdeps(None, None))"

      - name: Build SB + NOSB UEFI for xiaomi-piano
        run: |
          set -x
          . /tmp/muvenv/bin/activate
          ./build_uefi.py -d xiaomi-piano
          find Build -maxdepth 5 -type f \( -name '*.img' -o -name '*.fd' \) -printf '%p %s\n'

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uefi-images-xiaomi-piano
          path: Build/*/ci_artifacts
          compression-level: 9
          if-no-files-found: warn
