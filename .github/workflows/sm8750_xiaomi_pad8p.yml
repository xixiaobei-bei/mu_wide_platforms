name: SM8750 Xiaomi Pad8 Pro

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Platforms/PakalaPkg/Device/xiaomi-piano/**'
  workflow_dispatch:

env:
  WM_CI_BUILD: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Host toolchain
        run: |
          set -eux
          sudo apt update -qq
          sudo apt install -y -qq --no-install-recommends \
            uuid-dev clang llvm lld gcc-aarch64-linux-gnu git build-essential \
            iasl nasm gettext locales ca-certificates curl \
            python3 python3-venv python3-pip python3-git gnupg mono-devel
          git config --global --add safe.directory '*'
          python3 -m venv /tmp/muvenv
          . /tmp/muvenv/bin/activate
          pip install --upgrade pip
          pip install -r pip-requirements.txt

      - name: Init submodules (stuart_setup/update)
        run: |
          set -x
          . /tmp/muvenv/bin/activate
          ./build_uefi.py --init || true

      - name: Drop unavailable NuGet-only tool dependencies
        run: |
          set -x
          find . -name '*.ext_dep.json' -print
          find . -name '*.ext_dep.json' -print0 \
            | xargs -0 -r grep -lE 'mu_nasm|edk2-acpica-iasl|mu-uncrustify-release' \
            | while read -r f; do echo "disabling $f"; mv "$f" "$f.disabled"; done
          echo "=== remaining ext_dep declarations"
          find . -name '*.ext_dep.json' -print | head -40

      - name: Build SB + NOSB UEFI for xiaomi-piano
        run: |
          set -x
          . /tmp/muvenv/bin/activate
          ./build_uefi.py -d xiaomi-piano
          find Build -maxdepth 4 -type f \( -name '*.img' -o -name '*.fd' \) -printf '%p %s\n'

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uefi-images-xiaomi-piano
          path: Build/*/ci_artifacts
          compression-level: 9
          if-no-files-found: warn
